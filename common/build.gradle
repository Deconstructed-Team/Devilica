// Celeritas common: the Minecraft-independent terrain renderer, vendored from
// https://git.taumc.org/embeddedt/celeritas (see docs/UPSTREAM.md).
// It must never depend on Minecraft or Forge; the mod in the root project embeds it.
plugins {
    id 'java-library'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

repositories {
    mavenCentral()
}

// Everything here is on Cleanroom 0.7's class path at runtime, so nothing is bundled.
dependencies {
    compileOnly platform('org.lwjgl:lwjgl-bom:3.4.3')
    compileOnly 'org.lwjgl:lwjgl'
    compileOnly 'org.lwjgl:lwjgl-opengl'
    compileOnly 'org.joml:joml:1.10.9'
    compileOnly 'it.unimi.dsi:fastutil:8.5.18'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.26.0'
    compileOnly 'org.ow2.asm:asm:9.10.1'
    compileOnly 'org.ow2.asm:asm-tree:9.10.1'
    compileOnly 'org.ow2.asm:asm-util:9.10.1'
    compileOnly 'com.google.code.gson:gson:2.14.0'
    compileOnly 'org.jetbrains:annotations:26.0.2'
    compileOnly 'org.projectlombok:lombok:1.18.46'
    annotationProcessor 'org.projectlombok:lombok:1.18.46'
}
